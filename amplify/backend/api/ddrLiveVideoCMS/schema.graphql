type VodAsset
  @model(subscriptions: { level: public })
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        operations: [create, update, delete, read]
      }
      { allow: public, provider: apiKey, operations: [read] }
    ]
  ) {
  id: ID!
  title: String!
  description: String!
  broadcastDate: String!

  #DO NOT EDIT
  video: VideoObject @connection
}

#DO NOT EDIT
type VideoObject
  @model
  @auth(
    rules: [
      {
        allow: groups
        groups: ["Admin"]
        operations: [create, update, delete, read]
      }
      { allow: public, provider: apiKey, operations: [read] }
    ]
  ) {
  id: ID!
}
